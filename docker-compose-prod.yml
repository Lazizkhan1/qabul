services:
  # ─────────────────────────────────────────────────────────
  # Spring Boot application
  # ─────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: qabul-app
    restart: unless-stopped
    env_file:
      - .env.prod
    ports:
      - "8080:8080"
    volumes:
      # Persist daily log files on the host so they survive container restarts
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL",
             "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - qabul-net

networks:
  qabul-net:
    name: qabul-network
    driver: bridge
