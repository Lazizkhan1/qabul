name: Build and Deploy to ACI

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      # 2. Login to Azure
      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login to ACR
      - name: 'Login to ACR'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # 4. Build and Push Image
      - name: 'Build and Push Image'
        run: |
          docker build . -t ${{ secrets.REGISTRY_LOGIN_SERVER }}/myapp:${{ github.sha }}
          docker push ${{ secrets.REGISTRY_LOGIN_SERVER }}/myapp:${{ github.sha }}

      # 5. Deploy to Azure Container Instances
      - name: 'Deploy to ACI'
        uses: 'azure/aci-deploy@v1'
        with:
          resource-group: myResourceGroup
          dns-name-label: my-unique-app-label
          image: ${{ secrets.REGISTRY_LOGIN_SERVER }}/myapp:${{ github.sha }}
          registry-login-server: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          registry-username: ${{ secrets.REGISTRY_USERNAME }}
          registry-password: ${{ secrets.REGISTRY_PASSWORD }}
          name: my-container-instance
          location: 'eastus'