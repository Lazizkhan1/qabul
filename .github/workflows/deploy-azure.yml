name: Build and Deploy to ACI

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout the code
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@v4

      # 2. Login to Azure
      - name: 'Login via Azure CLI'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 3. Login to ACR
      - name: 'Login to ACR'
        uses: azure/docker-login@v2
        with:
          login-server: ${{ vars.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      # 4. Build and Push Image
      - name: 'Build and Push Image'
        run: |
          docker build . -t ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.AZURE_CONTAINER_IMAGE_NAME }}:latest
          docker push ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.AZURE_CONTAINER_IMAGE_NAME }}:latest

      # 5. Deploy to Azure Container Instances
      - name: 'Deploy to ACI'
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ vars.AZURE_RESOURCE_GROUP }}
          dns-name-label: umftqabul
          image: ${{ vars.ACR_LOGIN_SERVER }}/${{ vars.AZURE_CONTAINER_IMAGE_NAME }}:latest
          registry-login-server: ${{ vars.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          name: ${{vars.AZURE_CONTAINER_NAME }}
          location: ${{vars.AZURE_LOCATION }}
          ports: 80 8080
          restart-policy: 'Always'
