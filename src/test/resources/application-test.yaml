spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/qabul_test
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: 123
  flyway:
    enabled: true
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: create-drop

qabul:
  auth:
    jwt-secret: test-secret-with-enough-length-for-auth0-jwt-signing
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    otp-ttl: PT5M
    admin-phone: 998900000001
    admin-password: admin-password
  otp:
    url: https://api.telegram.org
    token: ""
  files:
    base-dir: build/test-storage
    max-size-bytes: 5242880
    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
    allowed-extensions:
      - pdf
      - png
      - jpg
      - jpeg
